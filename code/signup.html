<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>회원가입</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Malgun Gothic', sans-serif;
                background-color: #f5f5f5;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .signup-container {
                background: white;
                padding: 50px;
                border-radius: 10px;
                box-shadow: 0 2px 20px rgba(0,0,0,0.1);
                width: 500px;
            }

            h1 {
                color: rgb(14, 0, 139);
                text-align: center;
                margin-bottom: 40px;
                font-size: 32px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: bold;
            }

            .form-input {
                width: 100%;
                padding: 12px;
                font-size: 16px;
                border: 1px solid #ddd;
                border-radius: 5px;
                outline: none;
            }

            .form-input:focus {
                border-color: rgb(14, 0, 139);
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }

            .submit-btn {
                flex: 1;
                font-size: 18px;
                padding: 12px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s ease;
                background-color: rgb(14, 0, 139);
                color: white;
            }

            .submit-btn:hover {
                background-color: rgb(20, 0, 180);
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: #666;
                text-decoration: none;
                font-size: 14px;
            }

            .back-link a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="signup-container">
            <h1>회원 가입</h1>
            <form id="signupForm">
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" name="name" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label>이메일</label>
                    <input type="email" name="email" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" name="password" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label>비밀번호 재확인</label>
                    <input type="password" name="password_confirm" class="form-input" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="submit-btn">회원가입</button>
                </div>
            </form>
            <div class="back-link">
                <a href="login.html">← 로그인으로 돌아가기</a>
            </div>
        </div>

        <script>
            document.getElementById('signupForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password = document.querySelector('input[name="password"]').value;
                const passwordConfirm = document.querySelector('input[name="password_confirm"]').value;

                if (password !== passwordConfirm) {
                    alert('비밀번호가 일치하지 않습니다.');
                    return;
                }

                // GitHub Pages에서는 실제 회원가입 기능이 작동하지 않으므로
                // 데모용 안내 메시지 표시
                alert('GitHub Pages 데모 버전입니다.\n\n실제 회원가입 기능은 서버 배포 시 작동합니다.\n(현재는 정적 페이지로만 제공됩니다)');
            });
        </script>
    </body>
</html>
