<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: white;
            padding: 30px 0;
            border-bottom: 2px solid #ddd;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #333;
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px 20px;
            background-color: white;
            border: 2px solid #ddd;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .order-row {
            display: grid;
            grid-template-columns: 150px 200px 250px 200px 150px 150px;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .order-image {
            width: 150px;
            height: 150px;
            background-color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            border: 1px solid #ddd;
            text-align: center;
            padding: 10px;
        }

        .order-image .booking-number {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .order-field {
            padding: 15px;
            border: 1px solid #ddd;
            background-color: white;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }

        .order-field.header {
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
        }

        .order-field strong {
            color: #333;
            font-weight: bold;
        }

        .order-row:first-of-type {
            margin-bottom: 20px;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .order-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .order-image {
                width: 100%;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>[데이터 요구사항] 주문 내역 페이지</h1>
    </header>

    <div class="main-container">
        <div class="section-title">주문 내역</div>
        
        <!-- 헤더 -->
        <div class="order-row">
            <div class="order-field header">예매 번호</div>
            <div class="order-field header">예매 일자</div>
            <div class="order-field header">예매 공연명</div>
            <div class="order-field header">예매자 이름<br>예매자 이메일</div>
            <div class="order-field header">예매 수량</div>
            <div class="order-field header">총 예매 가격</div>
        </div>

        <div id="ordersList">
            <!-- 서버에서 데이터가 들어올 자리 -->
        </div>
    </div>

    <script>
        // 샘플 데이터 (실제로는 서버에서 받아옴)
        const orders = [
            {
                id: 1001,
                date: '2026-01-10',
                concertName: '클래식 오케스트라',
                userName: '김병성',
                userEmail: 'kim@example.com',
                quantity: 2,
                totalPrice: 160000
            },
            {
                id: 1002,
                date: '2026-01-12',
                concertName: '뮤지컬 레미제라블',
                userName: '김병성',
                userEmail: 'kim@example.com',
                quantity: 1,
                totalPrice: 120000
            }
        ];

        function renderOrders() {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<div class="no-data">예매 내역이 없습니다.</div>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-row">
                    <div class="order-image">
                        <div style="color: #999; font-size: 12px;">예매 번호</div>
                        <div class="booking-number">${order.id}</div>
                    </div>
                    <div class="order-field"><strong>${order.date}</strong></div>
                    <div class="order-field"><strong>${order.concertName}</strong></div>
                    <div class="order-field">
                        <div>
                            <strong>${order.userName}</strong><br>
                            ${order.userEmail}
                        </div>
                    </div>
                    <div class="order-field"><strong>${order.quantity}장</strong></div>
                    <div class="order-field"><strong>${order.totalPrice.toLocaleString()}원</strong></div>
                </div>
            `).join('');
        }

        renderOrders();
    </script>
</body>
</html>
