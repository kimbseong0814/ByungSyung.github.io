<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>로그인</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Malgun Gothic', sans-serif;
                background-color: #f5f5f5;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .login-container {
                background: white;
                padding: 50px;
                border-radius: 10px;
                box-shadow: 0 2px 20px rgba(0,0,0,0.1);
                width: 400px;
            }

            h1 {
                color: rgb(14, 0, 139);
                text-align: center;
                margin-bottom: 40px;
                font-size: 32px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .login_inputs {
                width: 100%;
                padding: 12px;
                font-size: 18px;
                border: 1px solid #ddd;
                border-radius: 5px;
                outline: none;
            }

            .login_inputs:focus {
                border-color: rgb(14, 0, 139);
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }

            #login_btn, #signup_btn {
                flex: 1;
                font-size: 18px;
                padding: 12px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            #login_btn {
                background-color: rgb(14, 0, 139);
                color: white;
            }

            #login_btn:hover {
                background-color: rgb(20, 0, 180);
            }

            #signup_btn {
                background-color: #666;
                color: white;
            }

            #signup_btn:hover {
                background-color: #888;
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: #666;
                text-decoration: none;
                font-size: 14px;
            }

            .back-link a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <h1>로그인</h1>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" name="email" class="login_inputs" placeholder="이메일" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="login_inputs" placeholder="비밀번호" required>
                </div>
                <div class="button-group">
                    <button type="submit" id="login_btn">로그인</button>
                    <button type="button" id="signup_btn" onclick="location.href='signup.html'">회원가입</button>
                </div>
            </form>
            <div class="back-link">
                <a href="../index.html">← 메인으로 돌아가기</a>
            </div>
        </div>

        <script>
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.querySelector('input[name="email"]').value;
                const password = document.querySelector('input[name="password"]').value;

                // GitHub Pages에서는 실제 로그인 기능이 작동하지 않으므로
                // 데모용 안내 메시지 표시
                alert('GitHub Pages 데모 버전입니다.\n\n실제 로그인 기능은 서버 배포 시 작동합니다.\n(현재는 정적 페이지로만 제공됩니다)');
            });
        </script>
    </body>
</html>
