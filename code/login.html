<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>로그인</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Malgun Gothic', sans-serif;
                background-color: #f5f5f5;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .login-container {
                background: white;
                padding: 50px;
                border-radius: 10px;
                box-shadow: 0 2px 20px rgba(0,0,0,0.1);
                width: 400px;
            }

            h1 {
                color: rgb(14, 0, 139);
                text-align: center;
                margin-bottom: 40px;
                font-size: 32px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .login_inputs {
                width: 100%;
                padding: 12px;
                font-size: 18px;
                border: 1px solid #ddd;
                border-radius: 5px;
                outline: none;
            }

            .login_inputs:focus {
                border-color: rgb(14, 0, 139);
            }

            .button-group {
                display: flex;
                gap: 10px;
                margin-top: 30px;
            }

            .btn {
                flex: 1;
                font-size: 18px;
                padding: 12px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .btn-login {
                background-color: rgb(14, 0, 139);
                color: white;
            }

            .btn-login:hover {
                background-color: rgb(20, 0, 180);
            }

            .btn-signup {
                background-color: #666;
                color: white;
            }

            .btn-signup:hover {
                background-color: #888;
            }

            .back-link {
                text-align: center;
                margin-top: 20px;
            }

            .back-link a {
                color: #666;
                text-decoration: none;
                font-size: 14px;
            }

            .back-link a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <h1>로그인</h1>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="text" name="email" class="login_inputs" placeholder="이메일" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="login_inputs" placeholder="비밀번호" required>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn btn-login">로그인</button>
                    <button type="button" class="btn btn-signup" onclick="handleSignup()">회원가입</button>
                </div>
            </form>
            <div class="back-link">
                <a href="../index.html">← 메인으로 돌아가기</a>
            </div>
        </div>

        <script>
            function handleLogin(event) {
                event.preventDefault();
                
                const email = document.querySelector('input[name="email"]').value;
                const password = document.querySelector('input[name="password"]').value;

                alert('GitHub Pages 데모 버전입니다.\n\n실제 로그인 기능은 서버 배포 시 작동합니다.');
                return false;
            }

            function handleSignup() {
                alert('회원가입 기능은 서버 배포 시 사용 가능합니다.\n\nGitHub Pages는 정적 페이지만 지원하므로\n로그인/회원가입 기능이 작동하지 않습니다.');
            }
        </script>
    </body>
</html>
