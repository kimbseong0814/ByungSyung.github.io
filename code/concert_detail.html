<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 상세</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: white;
            padding: 30px 0;
            border-bottom: 2px solid #ddd;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #333;
        }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px 20px;
            background-color: white;
            border: 2px solid #ddd;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .detail-image {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            color: #999;
            font-size: 14px;
            overflow: hidden;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-field {
            padding: 20px;
            border: 1px solid #ddd;
            background-color: white;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .info-field strong {
            color: #333;
            font-size: 16px;
        }

        .booking-section {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        .booking-field {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            background-color: white;
            text-align: center;
            font-size: 14px;
            color: #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .booking-field input {
            width: 80px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        .booking-button {
            flex: 1;
            padding: 15px;
            border: 1px solid #333;
            background-color: #333;
            color: white;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .booking-button:hover {
            background-color: #555;
        }

        .description-section {
            margin-top: 60px;
            padding: 40px;
            border: 1px solid #ddd;
            text-align: center;
            color: #666;
            font-size: 14px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .detail-content {
                grid-template-columns: 1fr;
            }

            .booking-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>[데이터 요구사항] 공연 상세 페이지</h1>
    </header>

    <div class="main-container">
        <div class="section-title">공연1 상세 페이지</div>
        
        <form method="POST" action="/bookConcert">
            <input type="hidden" name="concertId" id="concertId" value="">
            
            <div class="detail-content">
                <div class="detail-image" id="concertImage">
                    공연 이미지
                </div>
                
                <div class="detail-info">
                    <div class="info-field">
                        <div style="margin-bottom: 5px; color: #999; font-size: 12px;">공연명</div>
                        <strong id="concertName">-</strong>
                    </div>
                    <div class="info-field">
                        <div style="margin-bottom: 5px; color: #999; font-size: 12px;">날짜</div>
                        <strong id="concertDate">-</strong>
                    </div>
                    <div class="info-field">
                        <div style="margin-bottom: 5px; color: #999; font-size: 12px;">공연 가격</div>
                        <strong id="concertPrice">-</strong>
                    </div>
                    <div class="booking-section">
                        <div class="booking-field">
                            <div>수량 (input)</div>
                            <input type="number" name="quantity" value="1" min="1" max="10">
                        </div>
                        <button type="submit" class="booking-button">예매하기</button>
                    </div>
                </div>
            </div>

            <div class="description-section" id="concertDescription">
                공연 소개
            </div>
        </form>
    </div>

    <script>
        // URL에서 concertId 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const concertId = urlParams.get('concertId');

        // 샘플 데이터 (실제로는 서버에서 받아옴)
        const concerts = {
            1: { 
                name: '클래식 오케스트라', 
                date: '2026-03-15', 
                venue: '세종문화회관', 
                price: 80000, 
                description: '세계적인 오케스트라와 함께하는 클래식의 향연\n감동적인 음악으로 채워지는 특별한 밤',
                image: '/img/orchestra.jpg'
            },
            2: { 
                name: '뮤지컬 레미제라블', 
                date: '2026-04-20', 
                venue: '샤롯데씨어터', 
                price: 120000, 
                description: '감동의 대작 뮤지컬 레미제라블\n최고의 배우들이 선사하는 감동',
                image: '/img/musical.jpg'
            },
            3: { 
                name: '재즈 페스티벌', 
                date: '2026-05-10', 
                venue: '올림픽공원', 
                price: 65000, 
                description: '유명 재즈 아티스트들의 특별한 공연\n재즈의 매력에 빠져보세요',
                image: '/img/jazz.jpg'
            },
            4: { 
                name: '발레 백조의 호수', 
                date: '2026-06-05', 
                venue: '예술의전당', 
                price: 95000, 
                description: '우아하고 아름다운 발레 공연\n최고의 발레리나들이 선사하는 예술',
                image: '/img/ballet.jpg'
            }
        };

        const concert = concerts[concertId] || concerts[1];
        
        // 페이지에 데이터 표시
        document.getElementById('concertId').value = concertId || 1;
        document.getElementById('concertName').textContent = concert.name;
        document.getElementById('concertDate').textContent = concert.date;
        document.getElementById('concertPrice').textContent = concert.price.toLocaleString() + '원';
        document.getElementById('concertDescription').textContent = concert.description;
        
        // 이미지 표시
        const imageDiv = document.getElementById('concertImage');
        const img = document.createElement('img');
        img.src = concert.image;
        img.alt = concert.name;
        img.onerror = function() {
            imageDiv.innerHTML = '공연 이미지';
        };
        imageDiv.innerHTML = '';
        imageDiv.appendChild(img);
    </script>
</body>
</html>
